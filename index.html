<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Domaines professionnels ISEN</title>
  <style>
    /* ===== GLOBAL ===== */
    html {
      font-family: "Open Sans", sans-serif;
      margin: 0;
      padding: 0;
    }
    body {
      margin: 0;
      padding: 0;
    }
    a {
      text-decoration: none;
      color: inherit;
    }

    /* ===== HEADER ===== */
    .header-isen {
      background: #fff;
      border-bottom: 1px solid #e5e5e5;
    }
    .header-container {
      max-width: 1400px;
      margin: 0 auto;
      padding: 0 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .header-logo img {
      height: 45px;
      width: auto;
    }
    .header-nav {
      background: #e30613;
      flex: 1;
      margin-left: 40px;
    }
    .header-nav ul {
      list-style: none;
      display: flex;
      justify-content: space-around;
      margin: 0;
      padding: 0;
    }
    .header-nav li {
      flex: 1;
      text-align: center;
    }
    .header-nav a {
      display: block;
      padding: 14px 10px;
      font-size: 1.2em;
      font-weight: bold;
      color: #fff;
      transition: background 0.2s;
    }
    .header-nav a:hover {
      text-decoration: underline;
    }

    /* ===== DP / IMAGES ===== */
    .dp-section {
      max-width: 1200px;
      margin: 40px auto;
      padding: 0 20px;
    }
    .dp-section h2 {
      font-size: 24px;
      font-weight: 700;
      margin-bottom: 30px;
      color: #000;
    }
    .dp-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
      gap: 20px;
    }
    .dp-card {
      border: 1px solid #ddd;
      border-radius: 8px;
      overflow: hidden;
      background: #fff;
      transition: transform 0.2s ease;
      position: relative;
      padding: 3px 3px 0;
    }
    .dp-card:hover {
      transform: translateY(-5px);
      box-shadow: 0 6px 15px rgba(0,0,0,0.1);
    }
    .dp-card img {
      width: 100%;
      height: auto;
      display: block;
    }
    .dp-card p {
      padding: 1px 0.5em;
      font-size: 16px;
      font-weight: bold;
      margin: 0;
      position: absolute;
      bottom: 1em;
      left: 0;
      background-color: #05819d;
      color: white;
      display: inline;
    }

    /* ===== FOOTER ===== */
    .site-footer {
      background: #000;
      color: #fff;
      padding: 40px 20px 20px;
    }
    .footer-container {
      display: flex;
      max-width: 1200px;
      margin: 0 auto;
      gap: 40px;
      flex-wrap: wrap;
    }
    .footer-col-logo {
      flex: 1;
      min-width: 220px;
      display: flex;
      flex-direction: column;
    }
    .footer-logo {
      height: 100px;
      margin-bottom: 15px;
      margin-top: 30px;
    }
    .btn-contact {
      display: block;
      padding: 10px 20px;
      background: #c8102e;
      color: #fff;
      font-weight: 600;
      text-decoration: none;
      border-radius: 25px;
      margin: auto;
    }
    .btn-contact:hover {
      background: #a00b23;
    }
    .footer-links-section {
      flex: 3;
      display: flex;
      flex-direction: column;
    }
    .footer-cities {
      font-size: 40px;
      font-weight: 700;
      text-align: left;
      margin-bottom: 20px;
    }
    .footer-bottom {
      text-align: center;
      padding-top: 15px;
      background-color: white;
      color: black;
      font-size: 14px;
    }
  </style>
</head>
<body>

  <!-- HEADER -->
  <header class="header-isen">
    <div class="header-container">
      <a href="/" class="header-logo">
        <img src="https://isen-ouest.fr/wp-content/uploads/2024/07/15/logo-isen-couleur.png" alt="ISEN Ouest">
      </a>
      <nav class="header-nav">
        <ul>
          <li><a href="#">Liens à venir</a></li>
        </ul>
      </nav>
    </div>
  </header>

  <!-- SECTION IMAGES -->
  <section class="dp-section">
    <h2>Nos formations ingénieurs</h2>
    <div class="dp-grid">
      <div class="dp-card">
        <a href="https://isen-ouest.fr">
          <img src="https://isen-ouest.fr/wp-content/uploads/2024/10/21/vignette-dp-cybersecurite.png" alt="Cybersécurité">
        </a>
        <p>Cybersécurité</p>
      </div>
      <div class="dp-card">
        <a href="https://isen-ouest.fr">
          <img src="https://isen-ouest.fr/wp-content/uploads/2024/10/21/vignette-dp-developpement-logiciel.png" alt="Développement logiciel">
        </a>
        <p>Développement logiciel</p>
      </div>
      <div class="dp-card">
        <a href="https://isen-ouest.fr">
          <img src="https://isen-ouest.fr/wp-content/uploads/2024/10/21/vignette-dp-intelligence-artificielle.png" alt="Intelligence artificielle">
        </a>
        <p>Intelligence artificielle</p>
      </div>
      <div class="dp-card">
        <a href="https://isen-ouest.fr">
          <img src="https://isen-ouest.fr/wp-content/uploads/2024/10/18/formation-initiale-scaled.jpg" alt="Post-bac">
        </a>
        <p>Post-bac</p>
      </div>
      <div class="dp-card">
        <a href="https://isen-ouest.fr">
          <img src="https://isen-ouest.fr/wp-content/uploads/2024/10/18/formation-apprentissage-scaled.jpg" alt="FISA">
        </a>
        <p>FISA</p>
      </div>
    </div>
  </section>

  <!-- FOOTER -->
  <footer class="site-footer">
    <div class="footer-container">
      <div class="footer-col footer-col-logo">
        <img src="https://isen-ouest.fr/wp-content/uploads/2024/07/15/logo-isen-blanc.svg" alt="ISEN Ouest" class="footer-logo">
      </div>
      <div class="footer-links-section">
        <p class="footer-cities">Texte à venir</p>
      </div>
    </div>
    <div class="footer-bottom">
      &copy; 2025 ISEN Ouest
    </div>
  </footer>

</body>
</html>
